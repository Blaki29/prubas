<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Botón de Colapso</title>
    
    <!-- 1. CSS de Bootstrap 5 -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-5">
        <!-- Botón que activa el colapso -->
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#miContenidoColapsable" aria-expanded="false" aria-controls="miContenidoColapsable">
          Mostrar / Ocultar contenido
        </button>

        <!-- Elemento que se oculta y se muestra -->
        <div class="collapse" id="miContenidoColapsable">
          <div class="card card-body mt-2">
            ¡Funciona! Este es el contenido colapsable usando Bootstrap 5 desde GitHub.
          </div>
        </div>
    </div>

    <!-- 2. JS de Bootstrap 5 (Requerido para que el botón funcione) -->
    <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
